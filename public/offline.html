<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F6F7F5">
  <title>Offline · GWA Calculator</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; box-sizing: border-box; background: #F6F7F5; color: #111725;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
    main { max-width: 22rem; }
    img { width: 64px; height: 64px; }
    h1 { font-family: Georgia, serif; font-weight: 500; font-size: 1.5rem; margin: 1rem 0 .5rem; }
    p { margin: 0 0 1.5rem; color: #5B6478; line-height: 1.5; font-size: .95rem; }
    button { background: #1F7A2B; color: #fff; border: 0; border-radius: 8px; padding: .65rem 1.25rem;
      font-size: .95rem; font-weight: 500; cursor: pointer; }
    button:hover { background: #104E18; }
    @media (prefers-color-scheme: dark) {
      body { background: #0E121A; color: #ECEEF3; }
      p { color: #969EAF; }
    }
  </style>
</head>
<body>
  <main>
    <img src="/logo.svg" alt="" width="64" height="64">
    <h1>You're offline</h1>
    <p>GWA Calculator needs a connection to load. Check your internet and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
